<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Bola dan Tulisan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Area animasi bola */
        .area-bola {
            width: 100%;
            height: 260px;
            position: relative;
        }

        /* Bentuk bola */
        .bola {
            width: 250px;
            height: 250px;
            background-color: skyblue;;
            border-radius: 50%;

            position: absolute;
            top: 10px;
            left: 0;

            animation: gerakBola 4s ease-in-out infinite alternate;
        }

        /* Gerakan bola kanan dan kiri */
        @keyframes gerakBola {
            0% {
                left: 0;
            }

            100% {
                left: calc(100% - 250px);
            }
        }

        /* Kotak tulisan */
        .kotak-teks {
            width: 100%;
            height: 120px;
            background-color: lightpink;

            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* Jalur tulisan */
        .teks-berjalan {
            display: flex;
            width: max-content;
            animation: berjalan 12s linear infinite;
        }

        /* Tulisan */
        .teks-berjalan span {
            color: rgb(255, 255, 255);
            font-size: 60px;
            font-weight: bold;
            white-space: nowrap;
            padding-right: 50px;

            display: inline-block;
           
        }

        /* Tulisan bergerak menyamping */
        @keyframes berjalan {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

      
    </style>
</head>

<body>

    <!-- Bola bergerak -->
    <div class="area-bola">
        <div class="bola"></div>
    </div>

    <!-- Tulisan bergerak -->
    <div class="kotak-teks">

        <div class="teks-berjalan">

            <span>
                Assalamu'alaikum Warahmatullahi Wabarakatuh, Saya Imann
            </span>

          
        </div>

    </div>

</body>
</html>
