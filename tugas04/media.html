<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas IV - Media & Layout</title>
    <link rel="icon" type="image/x-icon" href="assets/gambarPeTK.jpeg">

    <!-- Font (ada fallback jika offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --red: #DA291C;
            --red-dark: #8f0f0f;
            --black: #140606;
            --gold: #FBE122;
            --white: #ffffff;
            --soft: #f3dfdf;
            --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
            --body: "Barlow", "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ===== Latar gradasi bergerak ===== */
        body {
            font-family: var(--body);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
            background: linear-gradient(135deg,
                var(--red), var(--red-dark), var(--black), #6b0b0b, var(--red), #b01a12);
            background-size: 500% 500%;
            animation: gradasi 14s ease infinite;
        }

        @keyframes gradasi {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Bar atas ===== */
        .topbar {
            background: rgba(20, 6, 6, 0.85);
            border-bottom: 4px solid var(--gold);
        }

        .topbar .isi {
            width: min(1100px, 92%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
        }

        .merek {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: var(--display);
            font-size: 1.7rem;
            letter-spacing: 3px;
        }

        /* Lencana perisai buatan CSS */
        .lencana {
            width: 38px;
            height: 44px;
            background: var(--red);
            border: 3px solid var(--gold);
            border-radius: 6px 6px 50% 50% / 6px 6px 70% 70%;
            display: grid;
            place-items: center;
            font-family: var(--display);
            font-size: 1.2rem;
            color: var(--gold);
            letter-spacing: 0;
        }

        .topbar .tag {
            color: var(--gold);
            font-family: var(--display);
            font-size: 1.3rem;
            letter-spacing: 3px;
        }

        .wrap {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 56px 0 32px;
        }

        /* ===== Hero ===== */
        .hero {
            position: relative;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 56px;
            align-items: center;
            padding-bottom: 64px;
        }

        /* teks besar bergaris tepi di belakang judul */
        .hero::before {
            content: "RED DEVILS";
            position: absolute;
            left: -8px;
            top: -34px;
            font-family: var(--display);
            font-size: clamp(5rem, 17vw, 13rem);
            line-height: 1;
            letter-spacing: 4px;
            color: transparent;
            -webkit-text-stroke: 2px rgba(251, 225, 34, 0.22);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .hero .teks { position: relative; }

        .hero h1 {
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(4.5rem, 12vw, 9rem);
            line-height: 0.88;
            letter-spacing: 2px;
            text-shadow: 5px 5px 0 rgba(0, 0, 0, 0.4);
        }

        .hero h2 {
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(1.7rem, 3.8vw, 2.6rem);
            letter-spacing: 4px;
            color: var(--gold);
            margin-top: 14px;
        }

        /* garis belang merah-emas */
        .belang {
            width: 170px;
            height: 10px;
            margin: 24px 0;
            background: repeating-linear-gradient(135deg,
                var(--gold) 0 10px, transparent 10px 18px);
        }

        .hero p {
            max-width: 46ch;
            color: var(--soft);
            font-size: 1.12rem;
        }

        /* Gambar tampil utuh, tidak dipotong */
        .hero figure {
            position: relative;
            justify-self: center;
            width: 100%;
            max-width: 440px;
        }

        .hero figure::before {
            content: "";
            position: absolute;
            inset: 0;
            transform: translate(18px, 18px);
            border: 4px solid var(--gold);
        }

        .hero img {
            position: relative;
            display: block;
            width: 100%;
            height: auto;
            border: 5px solid var(--white);
            background: var(--black);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
        }

        /* ===== Panel ===== */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .panel {
            background: rgba(20, 6, 6, 0.8);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
        }

        .panel.lebar { grid-column: 1 / -1; }

        .panel header {
            padding: 14px 24px;
            border-bottom: 4px solid var(--gold);
            /* motif garis seperti jersey */
            background: repeating-linear-gradient(90deg,
                var(--red) 0 22px, #c4221a 22px 44px);
        }

        .panel h3 {
            font-family: var(--display);
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 3px;
            line-height: 1.2;
        }

        .panel .isi { padding: 24px; }

        .ket {
            color: var(--soft);
            font-size: 0.97rem;
            margin-bottom: 16px;
        }

        audio, video, iframe {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 4px;
        }

        video { background: #000; max-height: 420px; }

        .rasio {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        .rasio iframe { position: absolute; inset: 0; height: 100%; }

        .tautan { margin: 14px 0 0; word-break: break-all; }
        .tautan a { color: var(--gold); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
        .tautan a:hover { color: var(--white); }

        /* ===== Footer ===== */
        footer {
            margin-top: 48px;
            padding: 20px 0;
            border-top: 4px solid var(--gold);
            background: rgba(20, 6, 6, 0.6);
            text-align: center;
            color: var(--soft);
            font-family: var(--display);
            font-size: 1.3rem;
            letter-spacing: 3px;
        }

        :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
        }

        @media (max-width: 820px) {
            .hero { grid-template-columns: 1fr; gap: 44px; text-align: center; }
            .hero::before { left: 50%; transform: translateX(-50%); }
            .hero p { margin: 0 auto; }
            .belang { margin: 24px auto; }
            .grid { grid-template-columns: 1fr; }
            .panel.lebar { grid-column: auto; }
            .topbar .tag { display: none; }
        }
    </style>
</head>
<body>

    <nav class="topbar">
        <div class="isi">
            <div class="merek"><span class="lencana">RD</span> Red Devils</div>
            <div class="tag">Media &amp; Layout</div>
        </div>
    </nav>

    <div class="wrap">

        <!-- Hero: judul + gambar -->
        <header class="hero">
            <div class="teks">
                <h1>Tugas IV</h1>
                <h2>Media &amp; Layout</h2>
                <div class="belang"></div>
                <p>Manchester United, 1876, Old Trafford.</p>
            </div>

            <figure>
                <!--tag img-->
                <img src="assets/gambar1.jpg" alt="gambar1">
            </figure>
        </header>

        <main class="grid">

            <!--tag audio-->
            <section class="panel lebar">
                <header><h3>Audio</h3></header>
                <div class="isi">
                    <p class="ket">Stop Crying Your Heart Out</p>
                    <audio controls>
                        <source src="assets/stopcryingyoutheart.mp3"  type="audio/mp3">
                    </audio>
                </div>
            </section>

            <!--tag video-->
            <section class="panel">
                <header><h3>Video</h3></header>
                <div class="isi">
                    <p class="ket">El Capitano</p>
                    <video controls>
                        <source src="assets/videobruno.mp4" type="video/mp4">
                        Browser kamu tidak mendukung tag video.
                    </video>
                </div>
            </section>

            <!--embed/iframe-->
            <section class="panel">
                <header><h3>YouTube</h3></header>
                <div class="isi">
                    <p class="ket">If I Had A Gun</p>
                    <div class="rasio">
                        <iframe src="https://www.youtube.com/embed/1NMUDb3Ewhs?si=VlWBAJ2VYcy2h6rj" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                    <p class="ket tautan"><a href="https://www.youtube.com/watch?v=1NMUDb3Ewhs" target="_blank" rel="noopener">Buka di YouTube: youtube.com/watch?v=1NMUDb3Ewhs</a></p>
                </div>
            </section>

        </main>

    </div>

    <footer>Tugas IV &ndash; Media &amp; Layout</footer>

</body>
</html>
